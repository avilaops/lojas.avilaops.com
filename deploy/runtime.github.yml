services:
  lojas:
    command: ["node", "server.js"]
    volumes: !override
      - /opt/lojas/uploads:/app/uploads
      - /opt/lojas/r2-secrets:/run/secrets/fiscal:ro
    environment:
      FISCAL_R2_CREDENTIALS_FILE: /run/secrets/fiscal/credentials.json
      FISCAL_R2_BUCKET: avilaops-fiscal-acervo
      UPLOADS_DIR: /app/uploads
      FUNDO_MODELOS_DIR: /app/modelos
      FUNDO_MODELO: u2netp
      FUNDO_URL: ""
      FUNDO_TOKEN: ""
      PRISMA_QUERY_ENGINE_LIBRARY: /app/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node
