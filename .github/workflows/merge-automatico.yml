name: Merge automático
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write
  actions: write
# Um merge por vez: dois PRs abertos juntos não disputam a main.
concurrency:
  group: merge-automatico
  cancel-in-progress: false
jobs:
  merge:
    # Rascunho espera virar "pronto". PR de fork fica de fora: o token dele é
    # só de leitura e código de fora não entra na main sem ninguém olhar.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # Não espera o build: tipos, testes e build rodam no `Dockerfile`, no
      # deploy disparado logo abaixo. PR com conflito falha aqui e fica aberto.
      - name: Juntar na main e apagar a branch
        run: gh pr merge "$PR" --squash --delete-branch
      # Merge feito com o token do próprio workflow não gera o evento `push`
      # que publicaria a main (regra do GitHub, para um workflow não disparar
      # outro em cadeia). `workflow_dispatch` é a exceção, então o deploy é
      # chamado à mão daqui.
      - name: Publicar a main
        run: gh workflow run deploy-production.yml --ref "${{ github.event.repository.default_branch }}"
