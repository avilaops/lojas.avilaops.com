name: Contrato de oferta multilocal

on:
  push:
    branches: [feat/avl-236-estoque-multilocal]
  pull_request:
    paths:
      - src/lib/catalogo-oferta.ts
      - tests/contracts/estoque-oferta.test.mjs
      - .github/workflows/estoque-multilocal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oferta:
    name: disponibilidade do local de reserva
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --experimental-transform-types --disable-warning=ExperimentalWarning --test tests/contracts/estoque-oferta.test.mjs
