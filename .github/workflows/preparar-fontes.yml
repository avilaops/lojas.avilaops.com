name: Preparar fontes locais
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lojas-fontes-locais-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: origem
        run: printf 'sha=%s\n' "$(gh api repos/google/fonts/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python -m pip install --disable-pip-version-check 'fonttools[woff]==4.60.2'
      - run: python scripts/ci/preparar-fontes.py "$RUNNER_TEMP/fontes-locais"
        env:
          FONT_SOURCE_SHA: ${{ steps.origem.outputs.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lojas-fontes-locais-${{ github.sha }}
          path: ${{ runner.temp }}/fontes-locais/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
