name: Build e deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Construção e implantação moram aqui, e não em `uses: avilaops/infra/...`:
  # este repositório é público e o avilaops/infra é privado, e o GitHub não
  # deixa repositório público chamar workflow reutilizável de repositório
  # privado — o run termina em `startup_failure` sem executar nada (06/10/2026).
  #
  # Os dois jobs abaixo são cópia fiel de avilaops/infra@5fc768f
  # (`.github/workflows/container.yml` e `deploy-ssh.yml`), com as mesmas
  # actions fixadas por SHA. Mudou lá, traga para cá.
  #
  # Tipos, testes e build já rodam dentro do `Dockerfile` (estágio `build`),
  # em pull request também — não há gate a acrescentar antes da imagem.
  image:
    name: image / build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # Pull request constrói e valida; só o push na main publica a imagem.
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    outputs:
      image: ${{ steps.result.outputs.image }}
    steps:
      - name: Obter codigo do commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validar publicacao
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" != pull_request* ]]
            [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          fi
          printf 'IMAGE_NAME=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Preparar Docker
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Autenticar no GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e validar imagem
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
      - name: Identificar imagem publicada
        if: env.PUBLISH == 'true'
        id: result
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s@%s\n' "$IMAGE_NAME" "$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: image
    # Só a main, só por push ou disparo manual, e só com o deploy ligado na
    # variável do repositório. Pull request — inclusive de fork, agora que o
    # repositório é público — nunca chega aqui nem vê os segredos.
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
      actions: read
    concurrency:
      group: deploy-production-lojas.avilaops.com
      cancel-in-progress: false
    steps:
      # Só o run mais novo publica.
      #
      # Em 08/10/2026 dois pushes seguidos correram em paralelo; o build do
      # commit mais antigo demorou mais e o deploy dele terminou por último.
      # Produção ficou na versão ANTERIOR à que o painel do GitHub mostrava
      # como publicada, sem o PR que tinha acabado de entrar. O `concurrency`
      # acima não pega isso: ele enfileira os deploys, não os ordena por commit.
      #
      # A pergunta é "existe um run mais novo deste workflow na main que ainda
      # vai publicar, ou já publicou?", e não "este commit é a ponta da main?":
      # commit com `[skip ci]` vira a ponta sem ter run nenhum, e por essa
      # segunda regra ninguém publicaria o código que veio antes dele.
      - name: Conferir que nenhum deploy mais novo passou na frente
        id: vez
        env:
          GH_TOKEN: ${{ github.token }}
          RAMO: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          mais_novos=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/runs?branch=${RAMO}&per_page=50" \
            --jq "[.workflow_runs[] | select(.id > ${GITHUB_RUN_ID} and .event != \"pull_request\" and (.conclusion == null or .conclusion == \"success\"))] | length")
          if (( mais_novos > 0 )); then
            echo "::notice::Há ${mais_novos} run(s) mais novo(s) deste workflow na ${RAMO}. Este não publica: publicar agora poria uma versão mais antiga por cima."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Enviar imagem ao servidor
        if: steps.vez.outputs.publicar == 'true'
        env:
          APPLICATION: lojas.avilaops.com
          IMAGE: ${{ needs.image.outputs.image }}
          DEPLOY_PORT: 22
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPLICATION" =~ ^[a-z0-9][a-z0-9.-]*$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/avilaops/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( DEPLOY_PORT > 0 && DEPLOY_PORT < 65536 ))
          temporary_ssh=$(mktemp -d)
          trap 'rm -rf "$temporary_ssh"' EXIT
          chmod 700 "$temporary_ssh"
          printf '%s\n' "$SSH_KEY" > "$temporary_ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$temporary_ssh/known_hosts"
          chmod 600 "$temporary_ssh/key" "$temporary_ssh/known_hosts"
          printf '%s\n' "$GHCR_TOKEN" | ssh -T -i "$temporary_ssh/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$temporary_ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $APPLICATION $IMAGE"

  # Depois do deploy, o que o navegador faria: /api/health com banco,
  # /v1/health e a folha de estilo seguida a partir do HTML da vitrine.
  # Sem dependência instalada — é o node do runner e `fetch`.
  fumaca:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/smoke-publicacao.mjs "${{ vars.SMOKE_URL || 'https://lojas.avilaops.com' }}"
      # O domínio da plataforma não tem /uploads, então a conferência da foto
      # só mede alguma coisa contra uma loja. O endereço é variável de CI e não
      # código: domínio de cliente não entra no repositório. Sem a variável,
      # este passo não roda — e a conferência da foto fica sem efeito, o que
      # está dito no README para ninguém contar com o que não está ligado.
      - if: vars.SMOKE_LOJA_URL != ''
        run: node scripts/smoke-publicacao.mjs "${{ vars.SMOKE_LOJA_URL }}"
