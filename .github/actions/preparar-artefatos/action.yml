name: Artefatos verificados em paralelo
description: Baixa os IDs exatos dos jobs produtores da execução atual e confere os manifestos.
inputs:
  ids:
    description: IDs dos artefatos separados por vírgula.
    required: true
  tipos:
    description: Tipos esperados separados por espaço.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/node-do-runner
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ inputs.ids }}
        path: ${{ runner.temp }}/lojas-artefatos
    - shell: bash
      env:
        ARTIFACT_TYPES: ${{ inputs.tipos }}
      run: |
        set -euo pipefail
        for tipo in $ARTIFACT_TYPES; do
          pasta="$RUNNER_TEMP/lojas-artefatos/lojas-$tipo-$GITHUB_SHA"
          node scripts/ci/artefato.mjs restaurar "$RUNNER_TEMP/lojas-artefatos" "$tipo"
          case "$tipo" in
            imagem-contexto)
              mkdir -p "$RUNNER_TEMP/lojas-image"
              tar --zstd -xf "$pasta/payload.tar.zst" -C "$RUNNER_TEMP/lojas-image"
              ;;
            dependencias|modelo|ferramenta-navegador)
              tar --zstd -xf "$pasta/payload.tar.zst"
              ;;
            build)
              mkdir -p .next/standalone
              tar --zstd -xf "$pasta/payload.tar.zst" -C .next/standalone
              ;;
            navegador)
              mkdir -p "$RUNNER_TEMP/chromium" "$HOME/.cache/ms-playwright"
              tar --zstd -xf "$pasta/payload.tar.zst" -C "$RUNNER_TEMP/chromium"
              cp -a "$RUNNER_TEMP/chromium/browsers/." "$HOME/.cache/ms-playwright/"
              executavel=$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell -print -quit)
              [[ -n "$executavel" ]]
              if ! ldd "$executavel" > "$RUNNER_TEMP/chromium-libs.txt" || grep -q 'not found' "$RUNNER_TEMP/chromium-libs.txt"; then
                npx playwright install-deps chromium
                ldd "$executavel" > "$RUNNER_TEMP/chromium-libs.txt"
              fi
              ! grep -q 'not found' "$RUNNER_TEMP/chromium-libs.txt"
              ;;
            fontes)
              mkdir -p "$HOME/.local/share/fonts"
              tar --zstd -xf "$pasta/payload.tar.zst" -C "$HOME/.local/share/fonts"
              fc-cache -f "$HOME/.local/share/fonts"
              ;;
            *) echo 'Tipo de artefato desconhecido' >&2; exit 1 ;;
          esac
        done
