name: Chromium desta execução
description: Restaura somente o navegador headless fixado pelo Playwright do lockfile.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: lojas-navegador-${{ github.sha }}
        path: ${{ runner.temp }}/lojas-navegador
    - shell: bash
      run: |
        set -euo pipefail
        node scripts/ci/artefato.mjs verificar "$RUNNER_TEMP/lojas-navegador" navegador
        mkdir -p "$HOME/.cache/ms-playwright"
        tar --zstd -xf "$RUNNER_TEMP/lojas-navegador/payload.tar.zst" -C "$HOME/.cache/ms-playwright"
        npx playwright install-deps chromium
