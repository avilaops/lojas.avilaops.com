name: Dependências verificadas desta execução
description: Restaura Node e o arquivo de dependências produzido pelo mesmo commit/run/attempt.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/node-do-runner
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: lojas-dependencias-${{ github.sha }}
        path: ${{ runner.temp }}/lojas-dependencias
    - shell: bash
      run: |
        set -euo pipefail
        node scripts/ci/artefato.mjs verificar "$RUNNER_TEMP/lojas-dependencias" dependencias
        tar --zstd -xf "$RUNNER_TEMP/lojas-dependencias/payload.tar.zst"
