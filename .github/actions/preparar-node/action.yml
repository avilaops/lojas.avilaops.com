name: Dependências verificadas desta execução
description: Restaura Node e as partes exatas produzidas pelo mesmo commit/run/attempt.
inputs:
  ids:
    description: IDs dos artefatos de dependências fornecidos pelo job produtor.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/preparar-artefatos
      with:
        ids: ${{ inputs.ids }}
        tipos: dependencias
